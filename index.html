:root{--ink:#2d1f3d;--cream:#fbeedd;--pink:#f5707f;--lav:#cdc4fb;--org:#f9b48e;--grn:#b7d4a0;--card:#fff4e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--cream);font-family:V,Tahoma,system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:16px}

/* ---------- wheel screen ---------- */
.q{font-size:clamp(17px,5.4vw,22px);font-weight:900;text-align:center;line-height:1.6;max-width:92vw}
.stage{position:relative;width:min(94vw,440px);aspect-ratio:1/1.0;}
.arch{position:absolute;inset:0;background:var(--lav);border:3px solid var(--ink);border-radius:999px 999px 6px 6px}
.arch:before{content:"";position:absolute;inset:10px;border:1.5px dashed #fff8;border-radius:999px 999px 4px 4px}
.wheel{position:absolute;left:2%;right:2%;top:14%;aspect-ratio:1/1}
#rot{position:absolute;inset:0;transition:transform 5s cubic-bezier(.12,.72,.08,1)}
#rot svg{width:100%;height:100%;display:block;overflow:visible}
.pin{position:absolute;left:50%;top:-5.5%;width:12%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 2px 0 #0003)}
#go{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:none;padding:0;z-index:3;cursor:pointer;font-family:inherit}
#go svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#go span{position:relative;font-weight:800;font-size:clamp(13px,4vw,17px);color:var(--ink)}
#go:active{transform:translate(-50%,-50%) scale(.94)}
.deco{position:absolute;z-index:4;pointer-events:none}
.dot-g{left:-3%;top:4%;width:21%;aspect-ratio:1;background:#a9cf8a;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;z-index:0}
.dot-g i{width:11px;height:13px;background:var(--pink);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.dot-o{right:-4%;bottom:6%;width:24%;aspect-ratio:1;background:var(--org);border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.dot-o b{font-size:20px;color:var(--pink);-webkit-text-stroke:2px var(--ink);transform:translateX(-30%)}
.face{left:1%;bottom:2%;width:15%;aspect-ratio:1;background:var(--org);border:3px solid var(--ink);border-radius:42% 42% 36% 36%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.face:before{content:"";position:absolute;top:-9px;left:50%;width:44%;height:11px;border:3px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;transform:translateX(-50%)}
.face u{display:flex;gap:6px;text-decoration:none;font-size:11px;font-weight:900}
.face em{width:8px;height:9px;border:2px solid var(--ink);border-radius:50%;background:#fff}
.star{font-size:22px;line-height:1}
.st1{right:2%;top:7%;color:var(--pink);-webkit-text-stroke:2px var(--ink)}
.st2{left:-1%;top:46%;font-size:18px;color:#a9cf8a;-webkit-text-stroke:2px var(--ink)}

/* ---------- result modal ---------- */
#modal{position:fixed;inset:0;background:#8f7b86;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
#modal.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(88vw,380px);background:var(--card);border:3px solid var(--ink);border-radius:20px;overflow:hidden;text-align:center;padding:50px 18px 20px;transform:translateY(30px) scale(.94);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
#modal.on .card{transform:none}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:14px;border-bottom:2.5px solid var(--ink);background:repeating-linear-gradient(135deg,#f0707f 0 12px,#fff 12px 20px,#8fb0ee 20px 32px,#fff 32px 40px)}
.stamp{position:absolute;right:14px;top:34px;width:62px;height:62px;background:var(--org);border:2.5px dashed var(--ink);display:grid;place-items:center;font-weight:800;font-size:11px;transform:rotate(7deg);direction:ltr}
.ico{width:min(46vw,170px);aspect-ratio:1;margin:6px auto 0;border-radius:50%;background:var(--lav);border:3px solid var(--ink);display:grid;place-items:center;font-size:min(20vw,72px)}
.ico svg{width:56%}
.tp{margin-top:14px;font-size:12px;font-weight:700;direction:ltr;letter-spacing:.3px}
h1{margin-top:8px;font-size:clamp(22px,7vw,28px);font-weight:900;line-height:1.4}
.sub{margin-top:8px;font-size:clamp(13px,3.8vw,15px);font-weight:400}
#msg{min-height:30px;margin-top:20px;font-weight:800;font-size:clamp(15px,4.6vw,18px);color:#c63d55;transition:opacity .2s}
.btns{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:800;border:2.5px solid var(--ink);border-radius:999px;cursor:pointer;color:var(--ink);transition:all .25s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
#yes{background:var(--pink);box-shadow:3px 3px 0 var(--ink);font-size:16px;padding:12px 22px}
#yes:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#no{background:#fff;font-size:14px;padding:11px 16px}
#heart{display:grid;place-items:center;width:40px;height:40px;margin:14px auto 0;border-radius:50%;background:#fff;border:2.5px solid var(--ink);font-size:18px;cursor:pointer;padding:0}
#heart:active{transform:scale(.88)}
.fl{position:fixed;z-index:50;pointer-events:none;font-size:22px;animation:up var(--d,3s) ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.6)}12%{opacity:1}100%{opacity:0;transform:translate(var(--x,0),-75vh) rotate(var(--r,40deg)) scale(1.1)}}
@media (max-height:640px){.ico{width:110px;font-size:50px}.card{padding-top:44px}}
#title{font-size:clamp(20px,6.4vw,26px)}</style>
</head>

  </div>

<noscript><div style="position:fixed;left:10px;right:10px;bottom:14px;z-index:99;background:#2d1f3d;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.8;text-align:center">برای چرخیدن، فایل را با <b>Safari</b> باز کنید:<br>دکمهٔ اشتراک (↑) پایین‌راست ← <b>Open in Safari</b></div></noscript>
<div id="modal">
  <div class="card">
    <div class="stamp" id="stamp">No.6</div>
    <div class="ico" id="ico"></div>
    <div class="tp">Sedra's choice</div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="msg"></div>
    <div class="btns"><button class="btn" id="yes">همینه، واثق!</button><button class="btn" id="no">یک بار دیگه بچرخان</button></div>
    <button id="heart" aria-label="love">♡</button>
  </div>
</div>

<script>
/* ======== تنظیمات — اینجا رو می‌تونی عوض کنی ======== */
const WIN = 6;               // شماره‌ی تکه‌ای که همیشه می‌ایسته (۰ = اولی)
const RESPINS = 2;           // چند بار دکمه‌ی «دوباره بچرخان» دوباره می‌چرخه و باز همان می‌آید
const SUB1 = "سدره جان، هیچ چیز دیگه نمیخواهم 🥹";
const ACTS = [
  {n:"طلا",          e:"💍"},
  {n:"موتر",         e:"🚗"},
  {n:"ایفون ۱۸",     e:"📱"},
  {n:"لپتاپ",        e:"💻"},
  {n:"کیف و بوت",    e:"👜"},
  {n:"سفر خارج",     e:"✈️"},
  {n:"فقط واثق|برایم کافیست", e:"💗", t:"فقط واثق برایم کافیست 🥹", win:1},
  {n:"ساعت برند",    e:"⌚"},
  {n:"عطر",          e:"🌸"},
  {n:"خانه",         e:"🏠"}
];
const RESPIN_MSGS = ["باز هم واثق؟ 😅","تقدیر هم میگه واثق 😌"];
const NO_MSGS = ["ایفون ۱۸ هم نی؟ 😳","طلا چی؟ موتر چی؟؟","واقعاً هیچ چیز دیگه نمیخواهی؟ 🥺","باشه، دلم آب شد 🥹 فقط واثق","دیگه دکمه‌ی چرخیدن بسته شد 😎"];
const FINAL = "تو هم برای من همه چیزی سدره جان 💗";
/* =================================================== */

const COL=["#f27b86","#f9b48e","#cfc8f7","#b7d4a0"], INK="#2d1f3d", N=ACTS.length, SEG=360/N;
const P=(r,a)=>[200+r*Math.sin(a*Math.PI/180),200-r*Math.cos(a*Math.PI/180)];

(function(){
  let s='<circle cx="200" cy="200" r="198" fill="'+INK+'"/>';
  for(let i=0;i<36;i++){const[x,y]=P(186,i*10);s+='<circle cx="'+x+'" cy="'+y+'" r="3.4" fill="'+(i%3?"#fff":"#f9b48e")+'"/>'}
  s+='<circle cx="200" cy="200" r="170" fill="#fff8ee"/><circle cx="200" cy="200" r="163" fill="none" stroke="#2d1f3d" stroke-width="1.5" stroke-dasharray="2 5"/>';
  for(let i=0;i<N;i++){
    const a0=i*SEG,a1=(i+1)*SEG,m=a0+SEG/2,[x0,y0]=P(154,a0),[x1,y1]=P(154,a1);
    s+='<path d="M200 200L'+x0+' '+y0+'A154 154 0 0 1 '+x1+' '+y1+'Z" fill="'+COL[i%4]+'" stroke="'+INK+'" stroke-width="2.2" stroke-linejoin="round"/>';
    const flip=m>180, L=ACTS[i].n.split('|'), fs=L.length>1?10.5:(L[0].length>8?11:12.5), fl=flip?' transform="rotate(180 84 0)"':'';
    let tx='';
    L.forEach((ln,k)=>{const dy=(k-(L.length-1)/2)*(fs+2)*(flip?-1:1);tx+='<text x="84" y="'+dy+'" font-size="'+fs+'" font-weight="800" fill="'+INK+'" text-anchor="middle" dominant-baseline="central" font-family="V,Tahoma,sans-serif"'+fl+'>'+ln+'</text>'});
    s+='<g transform="translate(200 200) rotate('+(m-90)+')">'
      +'<circle cx="137" cy="0" r="13.5" fill="#fff8ee" stroke="'+INK+'" stroke-width="2"/>'
      +'<text x="137" y="0" font-size="14" text-anchor="middle" dominant-baseline="central" transform="'+(flip?'rotate(180 137 0)':'')+'">'+ACTS[i].e+'</text>'+tx+'</g>';
  }
  document.getElementById('wsvg').innerHTML=s;
  let d='';for(let k=0;k<=120;k++){const t=k/120*2*Math.PI,r=47+4.2*Math.cos(12*t);d+=(k?'L':'M')+(r*Math.cos(t)).toFixed(1)+' '+(r*Math.sin(t)).toFixed(1)}
  document.getElementById('scal').innerHTML='<path d="'+d+'Z" fill="#f0707f" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/><path d="'+d+'Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="1 5" transform="scale(.82)"/>';
})();

const rot=document.getElementById('rot'), go=document.getElementById('go'), modal=document.getElementById('modal');
const yes=document.getElementById('yes'), no=document.getElementById('no'), msg=document.getElementById('msg');
let R=0, busy=false, respins=0, nos=0;
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

function spin(){
  if(busy)return; busy=true; vib(25);
  const off=(Math.random()-.5)*SEG*.6;
  const tt=((-(WIN*SEG+SEG/2+off))%360+360)%360;
  R=Math.ceil(R/360)*360+360*5+tt;
  rot.style.transform='rotate('+R+'deg)';
}
go.onclick=spin;
rot.addEventListener('transitionend',()=>{ if(!busy)return; vib([40,40,80]); setTimeout(showCard,350)});

function showCard(){
  busy=false; const a=ACTS[WIN];
  document.getElementById('ico').textContent=a.e;
  document.getElementById('stamp').textContent='No.1';
  document.getElementById('title').textContent=a.t;
  document.getElementById('sub').textContent=SUB1;
  msg.textContent = respins>0 ? RESPIN_MSGS[Math.min(respins,RESPIN_MSGS.length)-1] : '';
  modal.classList.add('on');
}

no.onclick=()=>{
  vib(15);
  if(respins<RESPINS){            // هنوز دوباره می‌چرخد و باز همان می‌آید
    respins++; modal.classList.remove('on');
    setTimeout(spin,500); return;
  }
  nos++;
  msg.textContent=NO_MSGS[Math.min(nos,NO_MSGS.length)-1];
  yes.style.fontSize=(16+nos*3.2)+'px'; yes.style.padding=(12+nos*2.2)+'px '+(22+nos*5)+'px';
  no.style.fontSize=Math.max(5,14-nos*2)+'px'; no.style.padding=Math.max(2,11-nos*1.6)+'px '+Math.max(5,16-nos*2.3)+'px';
  if(nos>=NO_MSGS.length) no.style.display='none';
};
yes.onclick=()=>{
  vib([30,50,30]);
  msg.textContent=FINAL; msg.style.fontSize='clamp(16px,5vw,20px)';
  document.querySelector('.btns').style.display='none';
  rain(46);
};
document.getElementById('heart').onclick=e=>{const r=e.target.getBoundingClientRect();float(r.left+r.width/2,r.top,'💗')};
function float(x,y,ch){
  const el=document.createElement('div'); el.className='fl'; el.textContent=ch;
  el.style.left=x+'px'; el.style.top=y+'px'; el.style.setProperty('--x',(Math.random()*120-60)+'px'); el.style.setProperty('--r',(Math.random()*80-40)+'deg'); el.style.setProperty('--d',(2.2+Math.random()*1.6)+'s');
  document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
}
function rain(n){
  const set=['💗','💖','🌸','💕','🌷','✨'];
  for(let i=0;i<n;i++)setTimeout(()=>float(Math.random()*innerWidth,innerHeight-30,set[i%set.length]),i*70);
}
</script>
</body>
</html>
